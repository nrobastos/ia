<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descarregar PDF</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #f8fafc, #eef2f7);
    }

    .card {
        background: white;
        padding: 3rem;
        border-radius: 18px;
        text-align: center;
        max-width: 420px;
        width: 90%;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .icon {
        font-size: 3rem;
        margin-bottom: 1rem;
    }

    h1 {
        margin: 0;
        color: #1e293b;
        font-size: 1.8rem;
    }

    p {
        color: #64748b;
        margin: 1rem 0 2rem;
        line-height: 1.5;
    }

    .btn {
        display: inline-block;
        padding: 14px 28px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        font-weight: 600;
        border-radius: 12px;
        transition: all 0.25s ease;
    }

    .btn:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }

    .info {
        margin-top: 1rem;
        font-size: 0.85rem;
        color: #94a3b8;
    }
</style>
</head>

<body>

<div class="card">
    <div class="icon">📄</div>

    <h1>Guião da Sessão</h1>


<button onclick="window.open('https://nrobastos.github.io/ia/guiao_sessao_gam_copia_V2.pdf', '_blank')">
    Abrir PDF
</button>
   
    <div class="info">
        Ficheiro PDF disponível para download.
    </div>
</div>

</body>
</html>
